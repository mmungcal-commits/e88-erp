name: Deploy E88 ERP - D1 Only (landed cost + per-class reconciliation)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type E88_ROLLOUT_DEPLOY to continue
        required: true
        type: string
      database_mode:
        description: How to prepare the D1 database
        required: true
        default: upgrade_existing
        type: choice
        options:
          - upgrade_existing            # SAFE: keep all data, apply code + new migrations
          - clean_rebuild_from_atlas    # DESTRUCTIVE: back up, wipe, reload opening stock from ATLAS
          - bootstrap_empty_database
          - wipe_transactions           # DESTRUCTIVE: back up, clear ALL business data (keep system config)
      rebuild_confirmation:
        description: For clean_rebuild ONLY, type E88_WIPE_AND_REBUILD (otherwise leave blank)
        required: false
        default: ''
        type: string
      run_smoke_test:
        description: Verify the live Worker and D1 binding after deployment
        required: true
        default: true
        type: boolean
      deployment_url:
        description: Live Worker URL used for the smoke test
        required: true
        default: https://e88-finsys.nrd-e88.workers.dev
        type: string

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  E88_BUILD: E88-ROLLOUT-ERP-20260731-R13.1

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'E88_ROLLOUT_DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate inputs and secrets
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "E88_ROLLOUT_DEPLOY"
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -f package.json && test -f wrangler.toml
          grep -q 'binding = "DB"' wrangler.toml
          if [ "${{ inputs.database_mode }}" = "clean_rebuild_from_atlas" ] && [ "${{ inputs.rebuild_confirmation }}" != "E88_WIPE_AND_REBUILD" ]; then
            echo "clean_rebuild_from_atlas selected but rebuild_confirmation is not E88_WIPE_AND_REBUILD. Aborting to protect data."
            exit 1
          fi
          if [ "${{ inputs.database_mode }}" = "wipe_transactions" ] && [ "${{ inputs.rebuild_confirmation }}" != "E88_WIPE_AND_REBUILD" ]; then
            echo "wipe_transactions selected but rebuild_confirmation is not E88_WIPE_AND_REBUILD. Aborting to protect data."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Confirm Cloudflare authentication
        run: npx wrangler whoami

      # ---------- ALWAYS back up before touching data ----------
      - name: Back up D1 (saved as a downloadable artifact)
        shell: bash
        run: npx wrangler d1 export DB --remote --output d1-backup.sql || echo "export skipped"

      - name: Upload D1 backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: d1-backup.sql
          retention-days: 90
          if-no-files-found: warn

      # ---------- SAFE upgrade path (keeps all data) ----------
      - name: Apply rollout + landed-cost + by-class reconciliation migrations
        if: ${{ inputs.database_mode == 'upgrade_existing' || inputs.database_mode == 'clean_rebuild_from_atlas' }}
        run: |
          npx wrangler d1 execute DB --remote --file=migrations/0024_landed_cost_at_receipt.sql
          npx wrangler d1 execute DB --remote --file=migrations/0026_by_class_reconciliation_views.sql
          npx wrangler d1 execute DB --remote --file=migrations/0028_operational_setup.sql
          npx wrangler d1 execute DB --remote --file=migrations/0029_po_approvals.sql
          npx wrangler d1 execute DB --remote --file=migrations/0030_assemblies.sql
          npx wrangler d1 execute DB --remote --file=migrations/0031_po_doc.sql
          npx wrangler d1 execute DB --remote --file=migrations/0032_demo_seed.sql
          npx wrangler d1 execute DB --remote --file=migrations/0033_rfp_alignment.sql
          npx wrangler d1 execute DB --remote --file=migrations/0034_supply_chain_master.sql
          npx wrangler d1 execute DB --remote --file=migrations/0033_demo_rfp_requestors.sql
          npx wrangler d1 execute DB --remote --file=migrations/0035_master_skus.sql
          npx wrangler d1 execute DB --remote --file=migrations/0036_departments_and_sample_requisition.sql
          # 0037_admin_operations_scope.sql is deliberately NOT run here: its two
          # ALTER TABLE statements were already applied by hand to the live database
          # and re-running them fails with "duplicate column name".
          npx wrangler d1 execute DB --remote --file=migrations/0038_blitz_live_operations.sql
          npx wrangler d1 execute DB --remote --file=migrations/0039_service_management.sql
          npx wrangler d1 execute DB --remote --file=migrations/0040_rfp_spec_conformance.sql
          npx wrangler d1 execute DB --remote --file=migrations/0041_people_and_roles.sql
          npx wrangler d1 execute DB --remote --file=migrations/0042_department_heads.sql
          npx wrangler d1 execute DB --remote --file=migrations/0043_finance_review.sql
          npx wrangler d1 execute DB --remote --file=migrations/0044_controls_and_count_chain.sql
          npx wrangler d1 execute DB --remote --file=migrations/0045_receivables_management.sql
          npx wrangler d1 execute DB --remote --file=migrations/0046_sales_register_2026.sql
          npx wrangler d1 execute DB --remote --file=migrations/0047_ar_collections_received.sql
          npx wrangler d1 execute DB --remote --file=migrations/0048_preferred_names.sql
          npx wrangler d1 execute DB --remote --file=migrations/0049_ar_statements.sql
          npx wrangler d1 execute DB --remote --file=migrations/0050_payment_request_lines.sql
          npx wrangler d1 execute DB --remote --file=migrations/0051_procurement_register_2026_01.sql
          npx wrangler d1 execute DB --remote --file=migrations/0051_procurement_register_2026_02.sql
          npx wrangler d1 execute DB --remote --file=migrations/0051_procurement_register_2026_03.sql
          npx wrangler d1 execute DB --remote --file=migrations/0051_procurement_register_2026_04.sql
          npx wrangler d1 execute DB --remote --file=migrations/0051_procurement_register_2026_05.sql
          npx wrangler d1 execute DB --remote --file=migrations/0052_collection_posting.sql
          npx wrangler d1 execute DB --remote --file=migrations/0053_attachment_dedupe.sql
          npx wrangler d1 execute DB --remote --file=migrations/0054_procurement_paid_status.sql
          npx wrangler d1 execute DB --remote --file=migrations/0055_payment_settlements.sql
          npx wrangler d1 execute DB --remote --file=migrations/0056_proof_of_payment_01.sql
          npx wrangler d1 execute DB --remote --file=migrations/0056_proof_of_payment_02.sql
          npx wrangler d1 execute DB --remote --file=migrations/0057_business_lines.sql
          npx wrangler d1 execute DB --remote --file=migrations/0058_station_host_vendors.sql
          npx wrangler d1 execute DB --remote --file=migrations/0059_rfp_encoder.sql
          npx wrangler d1 execute DB --remote --file=migrations/0060_sales_collections_01.sql
          npx wrangler d1 execute DB --remote --file=migrations/0060_sales_collections_02.sql
          npx wrangler d1 execute DB --remote --file=migrations/0061_lease_contracts.sql
          npx wrangler d1 execute DB --remote --file=migrations/0062_item_category_repair.sql
          npx wrangler d1 execute DB --remote --file=migrations/0063_clear_settled_receivables.sql
          npx wrangler d1 execute DB --remote --file=migrations/0064_lease_contract_files.sql
          npx wrangler d1 execute DB --remote --file=migrations/0066_mnc_dispatch.sql
          npx wrangler d1 execute DB --remote --file=migrations/0067_rfp_document_links.sql
          npx wrangler d1 execute DB --remote --file=migrations/0068_finance_check_is_rucels.sql
          npx wrangler d1 execute DB --remote --file=migrations/0069_rfp_document_on_submit.sql
          # 0065 must stay last: it re-applies operator deletions after every
          # seed above has had its chance to put the rows back.
          npx wrangler d1 execute DB --remote --file=migrations/0065_operator_deletions_stick.sql

      # ---------- Empty-database bootstrap (unchanged) ----------
      - name: Confirm D1 is empty before bootstrap
        if: ${{ inputs.database_mode == 'bootstrap_empty_database' }}
        run: node scripts/verify-empty-d1.mjs

      - name: Bootstrap empty D1 with opening records
        if: ${{ inputs.database_mode == 'bootstrap_empty_database' }}
        env:
          E88_BOOTSTRAP_CONFIRM: E88_NEW_DATABASE
        run: node scripts/apply-database.mjs --remote --confirm=E88_NEW_DATABASE

      # ---------- DESTRUCTIVE clean rebuild (gated) ----------
      - name: Clean rebuild — wipe data (keep config) and load opening inventory from ATLAS
        if: ${{ inputs.database_mode == 'clean_rebuild_from_atlas' && inputs.rebuild_confirmation == 'E88_WIPE_AND_REBUILD' }}
        run: |
          echo "Backup already uploaded as artifact d1-backup-${{ github.run_id }}."
          npx wrangler d1 execute DB --remote --file=rebuild/wipe_data_keep_config.sql
          npx wrangler d1 execute DB --remote --file=rebuild/0027_opening_inventory_from_atlas.sql

      # ---------- DESTRUCTIVE full data reset (gated) ----------
      - name: Full data reset — clear ALL business data (keep system config)
        if: ${{ inputs.database_mode == 'wipe_transactions' && inputs.rebuild_confirmation == 'E88_WIPE_AND_REBUILD' }}
        run: |
          echo "Backup already uploaded as artifact d1-backup-${{ github.run_id }}."
          npx wrangler d1 execute DB --remote --file=rebuild/wipe_all_business_keep_system.sql

      # ---------- Deploy the Worker ----------
      - name: Deploy Worker with D1 binding
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # ---------- Verify ----------
      - name: Verify inventory reconciles per class
        shell: bash
        run: |
          set -euo pipefail
          echo "Per-class reconciliation (diff should be 0):"
          npx wrangler d1 execute DB --remote --command="SELECT class_code,ROUND(subledger_value,2) sub,ROUND(gl_value,2) gl,ROUND(difference,2) diff FROM vw_erp_inventory_class_reconciliation WHERE subledger_value<>0 OR gl_value<>0;"

      - name: Verify live Worker and D1
        if: ${{ inputs.run_smoke_test }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
        run: |
          set -euo pipefail
          BASE="${DEPLOYMENT_URL%/}"
          for attempt in $(seq 1 12); do
            HEALTH=$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "$BASE/api/health" || true)
            echo "Attempt $attempt: $HEALTH"
            if echo "$HEALTH" | grep -q '"d1Bound":true' && echo "$HEALTH" | grep -q '"d1Ready":true'; then
              echo "Live deployment verification passed."; exit 0
            fi
            sleep 5
          done
          echo "Live verification failed. Review Worker logs and the D1 binding."; exit 1

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## E88 ERP deployment"
            echo "- Build: $E88_BUILD"
            echo "- Database mode: ${{ inputs.database_mode }}"
            echo "- Backup artifact: d1-backup-${{ github.run_id }} (90-day retention)"
            echo "- Deployment URL: ${{ inputs.deployment_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
